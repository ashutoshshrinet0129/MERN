<!DOCTYPE html>
<html lang="en">
<br>

<head>
    <br>
    <meta charset="UTF-8">
    <br>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <br>
    <title>Paragraphs & Text Formatting</title>
    <br>
</head>
<br>

<body>
    <!--This is a Paragraph Tag -->
    <br>
    <p>This is a Paragraph.</p>
    <!--br Tag-->
    <br>
    <p>First Line <br> Second Line</p>
    <!--Strong Tag -->
    <br><strong>Important text</strong>
    <!--em Tag-->
    <br><em>Emphasized text</em>
    <!--b Tag-->
    <br><b>Bold Without extra importance</b>
    <!-- i Tag -->
    <br><i>Alternate Voice or Mood</i>
    <!--u Tag-->
    <br><u>Underline Text</u>
    <!--mark Tag -->
    <br><mark>Highlighted text</mark>
    <!--small Tag-->
    <br><small>Small Text</small>
    <!--del Tag-->
    <br><del>Delete text</del>
    <!--ins Tag -->
    <br><ins>Inserted Text</ins>
    <!--sub Tag-->
    <br>H<sub>2</sub>O
    <!--sup Tag -->
    <br>x<sup>2</sup>
    <br>
</body>

</html>
