<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table_Tag </title>
</head>

<body>
    <table>
        <caption>Student Marks</caption>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ashutosh Singh</td>
                <td>85</td>
            </tr>
            <tr>
                <td>Priya Kumari</td>
                <td> 80</td>
            </tr>




        </tbody>




    </table>
</body>

</html>
