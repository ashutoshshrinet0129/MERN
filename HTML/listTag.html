<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List_Tag</title>
</head>
<body>
    <h1>UnOrdered List</h1>
    <!--UnOrdered List-->
  <ul>
<li>HTML</li>
<li>CSS</li>
<li>JAVA SCRIPT</li>
  </ul>  <br>
  <h1>Ordered List</h1>
   <!--Ordered List-->
 <ol>
<li>Learn Html</li>
<li>Learn Css</li>
<li>Learn JavaScript</li>
 </ol><br>
 <h1>Description  List</h1>
 <!--Description List -->
 <dl>
    <dt>HTML</dt>
    <dd>
        Structure Web Content.
    </dd>
    <dt>CSS</dt>
    <dd>Styles Web Content.</dd>
 </dl>
</body>
</html>
